<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora Financiera</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f172a; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
        .cargando {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: #0f172a; color: #94a3b8;
            font-family: Arial, sans-serif; font-size: 15px;
        }
        .tapa-banner {
            position: fixed; top: 0; left: 0; width: 100%; height: 60px;
            background: #0f172a; z-index: 999999; pointer-events: none; display: none;
        }
    </style>
</head>
<body>
    <div class="cargando" id="cargando">Cargando Bitácora Financiera…</div>
    <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbxXnoAlyIGQn7k7Buik1cIidwr9i5g_CWnVCl6LqOa4jn3eHPvagw4kjkCb1OamRualNw/exec"></iframe>
    <div class="tapa-banner" id="tapa"></div>
    <script>
    (function() {
        var APP_URL = 'https://script.google.com/macros/s/AKfycbxXnoAlyIGQn7k7Buik1cIidwr9i5g_CWnVCl6LqOa4jn3eHPvagw4kjkCb1OamRualNw/exec';
        var frame = document.getElementById('app-frame');
        var cargando = document.getElementById('cargando');
        var tapa = document.getElementById('tapa');
        var recibido = false;

        window.addEventListener('message', function(e) {
            if (e.data === 'bitacora-ready') {
                recibido = true;
                cargando.style.display = 'none';
                frame.style.display = 'block';
                tapa.style.display = 'block';
            }
        });

        setTimeout(function() {
            if (!recibido) {
                window.location.href = APP_URL;
            }
        }, 3000);
    })();
    </script>
</body>
</html>
