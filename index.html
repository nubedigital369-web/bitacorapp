<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora Financiera</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0f172a; }
#app { position:fixed; top:0; left:0; width:100%; height:100%; border:0; z-index:10; }
#cortina {
  position:fixed; top:0; left:0; width:100%; height:30px;
  background:#0f172a; z-index:2147483647; pointer-events:none;
}
@media (max-width: 600px) { #cortina { height: 50px; } }
</style>
</head>
<body>
<iframe id="app"></iframe>
<div id="cortina"></div>

<script>
const URL_APP = "https://script.google.com/macros/library/d/1X3Zf3M_HYYgIR6MUvTFnNiflMDv0hB6xs8kljUygwE86OOTpOWvJ3cs9/105";

// iPhone, iPad (incluye iPadOS que se presenta como Mac con pantalla táctil)
const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

if (esIOS) {
  // Safari bloquea cookies de terceros en iframes: abrir en la misma pestaña
  window.location.replace(URL_APP);
} else {
  document.getElementById("app").src = URL_APP;
}
</script>
</body>
</html>
