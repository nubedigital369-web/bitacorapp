<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bitácora Financiera</title>
  <style>
    :root { --crop: 90px; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0f172a; }
    #app {
      position: absolute;
      top: calc(var(--crop) * -1);
      left: 0;
      width: 100%;
      height: calc(100% + var(--crop));
      border: 0;
      display: none;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: #94a3b8;
      font-family: sans-serif;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <iframe id="app" allow="clipboard-write; fullscreen"></iframe>
  <div id="overlay">Verificando acceso…</div>

  <script>
    (function() {
      var APP_URL = 'https://script.google.com/macros/s/AKfycbyumXfpDlgpBlUPcDN1qCv3-oZ9iUrKWk2sFhSGW7AouLOl_vnkbTPX-EtXoKH4e1JzYg/exec';
      var appFrame = document.getElementById('app');
      var overlay = document.getElementById('overlay');
      var recibido = false;

      // La app avisa cuando carga dentro del iframe.
      window.addEventListener('message', function(e) {
        if (e.data === 'app-lista') {
          recibido = true;
          overlay.style.display = 'none';
          appFrame.style.display = 'block';
        }
      });

      appFrame.src = APP_URL;

      // Si en 4 segundos la app no avisó, significa que Google bloqueó
      // la carga (usuario no autorizado). Redirigimos la página completa.
      setTimeout(function() {
        if (!recibido) {
          window.location.replace(APP_URL);
        }
      }, 4000);
    })();
  </script>
</body>
</html>
