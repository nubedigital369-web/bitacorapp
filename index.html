<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora Financiera</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f172a; }
        #app-frame { width: 100%; height: calc(100% + 60px); margin-top: -60px; border: none; display: none; }
        #cargando {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background: #0f172a; color: #94a3b8;
            font-family: Arial, sans-serif; font-size: 15px;
            text-align: center; padding: 20px; box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="cargando">Verificando acceso…</div>
    <iframe id="app-frame" src="about:blank"></iframe>

    <script>
    (function() {
        var APP_URL = 'https://script.google.com/macros/s/AKfycbxhbH4YKyOBTXEBlWe6GqwZdGC7UWyapNuiAeVjlCNHoFv8fFbMKs8ZmMS25uiDjpc5rQ/exec';
        var frame = document.getElementById('app-frame');
        var cargando = document.getElementById('cargando');

        // Función que se ejecuta si el usuario SÍ está autorizado.
        window.authSuccess = function(email) {
            if (!email) {
                // No hay correo: no autorizado.
                window.location.href = APP_URL;
                return;
            }
            // Autorizado: mostrar el iframe con la app (banner tapado).
            cargando.style.display = 'none';
            frame.src = APP_URL;
            frame.style.display = 'block';
        };

        // Función que se ejecuta si el JSONP falla.
        window.authFailure = function() {
            window.location.href = APP_URL;
        };

        // Cargar el JSONP.
        var script = document.createElement('script');
        script.src = APP_URL + '?jsonpCallback=authSuccess';
        script.onerror = window.authFailure;
        document.body.appendChild(script);

        // Timeout de seguridad.
        setTimeout(function() {
            if (frame.style.display === 'none' && cargando.style.display !== 'none') {
                window.location.href = APP_URL;
            }
        }, 5000);
    })();
    </script>
</body>
</html>
