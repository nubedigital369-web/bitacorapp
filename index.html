
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bitácora Financiera</title>

  <style>
    :root {
      --crop: 110px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    #wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: #0f172a;
    }

    #app {
      position: absolute;
      top: calc(-1 * var(--crop));
      left: 0;
      width: 100%;
      height: calc(100% + var(--crop));
      border: 0;
      display: none;
      background: #fff;
    }

    #detector {
      display: none;
    }

    #cargando {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: #94a3b8;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    @media (max-width: 600px) {
      :root {
        --crop: 110px;
      }
    }
  </style>
</head>

<body>
  <div id="wrap">
    <iframe
      id="app"
      title="Bitácora Financiera"
      allow="clipboard-write; fullscreen">
    </iframe>

    <iframe id="detector"></iframe>

    <div id="cargando">Verificando acceso…</div>
  </div>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbyKi-k-89v1osCeg1F7l2iPGMpt6gDyczV2ba5okcbNGODBNnr5lZhSp1XXdkQ2O-wvUQ/exec";

    // Permite ajustar el recorte desde la URL: ?crop=110
    const params = new URLSearchParams(window.location.search);
    const crop = params.get("crop");

    if (crop !== null && /^\d+$/.test(crop)) {
      document.documentElement.style.setProperty(
        "--crop",
        crop + "px"
      );
    }

    const app = document.getElementById("app");
    const detector = document.getElementById("detector");
    const cargando = document.getElementById("cargando");

    let decidido = false;

    function mostrarAplicacion() {
      if (decidido) return;

      decidido = true;
      cargando.style.display = "none";
      app.src = APP_URL;
      app.style.display = "block";
    }

    function redirigirAplicacion() {
      if (decidido) return;

      decidido = true;
      window.location.replace(APP_URL);
    }

    detector.onload = function () {
      if (decidido) return;

      try {
        if (detector.contentWindow.length > 0) {
          mostrarAplicacion();
        } else {
          redirigirAplicacion();
        }
      } catch (error) {
        redirigirAplicacion();
      }
    };

    // Si la comprobación tarda demasiado, abre la aplicación.
    // Evita una redirección automática por un simple retraso.
    setTimeout(function () {
      if (!decidido) {
        mostrarAplicacion();
      }
    }, 4000);

    detector.src = APP_URL;
  </script>
</body>
</html>
