<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo a Bitácora Financiera...</title>
    
    <!-- Redirección automática a nivel de HTML -->
    <meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbyumXfpDlgpBlUPcDN1qCv3-oZ9iUrKWk2sFhSGW7AouLOl_vnkbTPX-EtXoKH4e1JzYg/exec">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0f172a; /* Mismo fondo de tu login */
            color: #f8fafc;
            text-align: center;
        }
        .loader {
            border: 4px solid #334155;
            border-top: 4px solid #0284c7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div>
        <div class="loader"></div>
        <h2>Redirigiendo a tu Bitácora Financiera...</h2>
        <p style="color: #94a3b8; font-size: 14px;">Si no eres redirigido automáticamente en unos segundos, <br>
        <a href="https://script.google.com/macros/s/AKfycbyumXfpDlgpBlUPcDN1qCv3-oZ9iUrKWk2sFhSGW7AouLOl_vnkbTPX-EtXoKH4e1JzYg/exec">haz clic aquí para ingresar</a>.</p>
    </div>

    <script>
        // Redirección inmediata por JavaScript (más rápido que el meta refresh)
        window.location.replace("https://script.google.com/macros/s/AKfycbyumXfpDlgpBlUPcDN1qCv3-oZ9iUrKWk2sFhSGW7AouLOl_vnkbTPX-EtXoKH4e1JzYg/exec");
    </script>
</body>
</html>
