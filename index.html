<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora Financiera</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0f172a; }
#app { position:fixed; top:0; left:0; width:100%; height:100%; border:0; z-index:10; display:none; }
#cortina {
  position:fixed; top:0; left:0; width:100%; height:30px;
  background:#0f172a; z-index:2147483647; pointer-events:none; display:none;
}
@media (max-width: 600px) { #cortina { height: 50px; } }
#overlay {
  position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center;
  background:#0f172a; color:#f8fafc; font-family:sans-serif; z-index:20; text-align:center; padding:24px; box-sizing:border-box;
}
#overlay h2 { font-size:20px; margin:0 0 12px; }
</style>
</head>
<body>

<div id="overlay">
  <h2>Cargando Bitácora Financiera…</h2>
</div>

<iframe id="app" src="about:blank"></iframe>
<div id="cortina"></div>

<script>
(function() {
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzxEalV4dhRmowsOK2_YOay1P6Lc-a9H0Dm_d9kmaQfdWkn7Bn553rSZ3XaZw6LMJnvbQ/exec';
  var app = document.getElementById('app');
  var cortina = document.getElementById('cortina');
  var overlay = document.getElementById('overlay');
  var autenticado = false;

  // Esta función la llama el doGet SIEMPRE (con o sin email).
  // Como no lanza error, el script carga y entramos al iframe.
  window.authSuccess = function() {
    if (autenticado) return;
    autenticado = true;
    overlay.style.display = 'none';
    app.src = APP_URL;
    app.style.display = 'block';
    cortina.style.display = 'block';
  };

  // Ejecutamos el JSONP. Como el doGet siempre devuelve un JSON válido,
  // esta función siempre llamará a authSuccess, incluso sin sesión de Google.
  var s = document.createElement('script');
  s.src = APP_URL + '?callback=authSuccess&_t=' + Date.now();
  document.body.appendChild(s);
})();
</script>
</body>
</html>
