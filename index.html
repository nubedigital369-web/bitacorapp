<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bitácora Financiera</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0f172a; }
#app {
  position:fixed; top:0; left:0; width:100%; height:100%;
  border:0; z-index:10; display:block;
}
#cortina {
  position:fixed; top:0; left:0; width:100%; height:140px;
  background:#0f172a; z-index:2147483647; pointer-events:none;
}
#cargando {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:flex; justify-content:center; align-items:center;
  background:#0f172a; color:#94a3b8; font-family:sans-serif;
  font-size:15px; z-index:20;
}
</style>
</head>
<body>
<div id="cargando">Cargando…</div>
<iframe id="app" src="about:blank" allow="storage-access *; clipboard-read; clipboard-write"></iframe>
<div id="cortina"></div>
<script>
(function(){
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyumXfpDlgpBlUPcDN1qCv3-oZ9iUrKWk2sFhSGW7AouLOl_vnkbTPX-EtXoKH4e1JzYg/exec';
  var f = document.getElementById('app');
  var c = document.getElementById('cargando');
  var ok = false;

  // Tu app envía este mensaje al final del Index.
  // Solo llega si la app cargó DE VERDAD (no si Google devolvió el 401).
  window.addEventListener('message', function(ev){
    if (ev && ev.data === 'bitacora-ready') {
      ok = true;
      c.style.display = 'none';
    }
  });

  function redirigir(){
    if (ok) return;
    window.location.replace(APP_URL);
  }

  // Intento de saltar bloqueo de cookies de terceros.
  if (document.requestStorageAccess) {
    document.requestStorageAccess().catch(function(){});
  }

  f.src = APP_URL;

  // Si en 6s tu app no ha confirmado, es 401 → redirigir (banner visible, pero app usable).
  setTimeout(redirigir, 6000);
})();
</script>
</body>
</html>
