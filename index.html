<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi App</title>
  <style>
    :root { --crop: 60px; }              /* alto de la franja del banner que se oculta */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    #wrap { position: fixed; inset: 0; overflow: hidden; }
    #app {
      position: absolute;
      top: calc(var(--crop) * -1);
      left: 0;
      width: 100%;
      height: calc(100% + var(--crop));
      border: 0;
    }
    /* En pantallas angostas el banner suele ocupar más líneas */
    @media (max-width: 600px) { :root { --crop: 80px; } }
  </style>
</head>
<body>
  <div id="wrap">
    <iframe id="app" title="Mi App" allow="clipboard-write; fullscreen"></iframe>
  </div>

  <script>
    // 👉 URL de tu implementación (termina en /exec)
    const APP_URL = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbxXnoAlyIGQn7k7Buik1cIidwr9i5g_CWnVCl6LqOa4jn3eHPvagw4kjkCb1OamRualNw/exec";

    // Modo calibración: abre  tusitio.github.io/repo/?crop=75  para probar otros valores sin editar el archivo
    const crop = new URLSearchParams(location.search).get("crop");
    if (crop && /^\d+$/.test(crop)) {
      document.documentElement.style.setProperty("--crop", crop + "px");
    }

    document.getElementById("app").src = APP_URL;
  </script>
</body>
</html>
