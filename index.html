<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora Financiera</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f172a; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
        .tapa-banner {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #0f172a;
            z-index: 999999;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <iframe id="app-frame" src="about:blank"></iframe>
    <div class="tapa-banner"></div>
    <script>
    (function() {
        var APP_URL = 'https://script.google.com/macros/s/AKfycbwBN0YwJONB6lpUg3i3yNwm6P05zUxZLoR4k3o5StDAvQVPXOtXLdCKuZ_xz_9EJarUpA/exec';

        // 1. Intentar cargar la app en el iframe.
        // 2. Si la carga falla (401 = usuario no autorizado), redirigir
        //    la página completa a la app para que Google pida permisos.
        var frame = document.getElementById('app-frame');
        frame.onload = function() {
            // Si el iframe cargó, verificar si el contenido es la app real.
            // Si Google muestra su página de error (401), el iframe carga
            // igual, así que no hay forma de detectarlo aquí.
        };
        frame.onerror = function() {
            window.location.href = APP_URL;
        };

        // Cargar la app.
        frame.src = APP_URL;

        // Timeout: si en 3 segundos no se ha autorizado, redirigir.
        // Esto cubre el caso del 401 que no dispara onerror.
        setTimeout(function() {
            try {
                // Si el iframe está vacío o cross-origin sin cargar, redirigir.
                var doc = frame.contentDocument;
                if (!doc || doc.location.href === 'about:blank') {
                    window.location.href = APP_URL;
                }
            } catch (e) {
                // Cross-origin normal: significa que la app cargó bien.
                // No redirigir.
            }
        }, 3000);
    })();
    </script>
</body>
</html>
