<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bitácora Financiera</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0f172a; }
#app { position:fixed; top:0; left:0; width:100%; height:100%; border:0; z-index:10; display:none; }
#cortina { position:fixed; top:0; left:0; width:100%; height:70px; background:#0f172a; z-index:2147483647; pointer-events:none; display:none; }
#inicio {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:flex; flex-direction:column; justify-content:center; align-items:center;
  background:#0f172a; color:#f8fafc; font-family:sans-serif; z-index:20; text-align:center; padding:24px; box-sizing:border-box;
}
#inicio h2 { font-size:20px; margin:0 0 8px; }
#inicio p { color:#94a3b8; font-size:14px; margin:0 0 24px; }
#btnEntrar {
  padding:14px 32px; border-radius:10px; border:none; background:#0284c7; color:#fff;
  font-size:16px; font-weight:600; cursor:pointer;
}
#btnEntrar:disabled { opacity:0.6; cursor:wait; }
</style>
</head>
<body>

<div id="inicio">
  <h2>Bitácora Financiera</h2>
  <p>Haz clic para entrar</p>
  <button id="btnEntrar">Entrar</button>
</div>

<iframe id="app" src="about:blank"></iframe>
<div id="cortina"></div>

<script>
(function() {
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzxEalV4dhRmowsOK2_YOay1P6Lc-a9H0Dm_d9kmaQfdWkn7Bn553rSZ3XaZw6LMJnvbQ/exec';
  var app = document.getElementById('app');
  var cortina = document.getElementById('cortina');
  var inicio = document.getElementById('inicio');
  var btn = document.getElementById('btnEntrar');

  function cargarApp() {
    inicio.style.display = 'none';
    app.style.display = 'block';
    cortina.style.display = 'block';
    app.src = APP_URL;
  }

  btn.addEventListener('click', function() {
    btn.disabled = true;
    btn.innerText = 'Cargando…';

    // El truco: pedir permiso de cookies para script.google.com
    // desde github.io. Requiere clic del usuario (esto lo da el botón).
    if (document.requestStorageAccessFor) {
      document.requestStorageAccessFor('https://script.google.com')
        .then(cargarApp)
        .catch(function() { cargarApp(); });
    } else if (document.requestStorageAccess) {
      // Fallback: pedir para el dominio propio
      document.requestStorageAccess()
        .then(cargarApp)
        .catch(function() { cargarApp(); });
    } else {
      cargarApp();
    }
  });
})();
</script>
</body>
</html>
