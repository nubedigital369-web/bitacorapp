<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora Financiera</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0f172a; }
#app { position:fixed; top:0; left:0; width:100%; height:100%; border:0; z-index:10; }
#cortina {
  position:fixed; top:0; left:0; width:100%; height:70px;
  background:#0f172a; z-index:2147483647; pointer-events:none;
}
@media (max-width: 600px) { #cortina { height: 90px; } }

#aviso {
  display:none;
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:#0f172a; color:#f8fafc; z-index:30;
  font-family:sans-serif; text-align:center; padding:32px; box-sizing:border-box;
  flex-direction:column; justify-content:center; align-items:center;
}
#aviso h2 { font-size:20px; margin:0 0 12px; font-weight:700; }
#aviso p { color:#94a3b8; font-size:14px; margin:0 0 8px; max-width:340px; line-height:1.5; }
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzxEalV4dhRmowsOK2_YOay1P6Lc-a9H0Dm_d9kmaQfdWkn7Bn553rSZ3XaZw6LMJnvbQ/exec"></iframe>
<div id="cortina"></div>

<div id="aviso">
  <h2>No pudimos cargar tu Bitácora</h2>
  <p>Si estás en una ventana de <strong>incógnito</strong> o sin tu cuenta de Google abierta, ciérrala y entra desde una ventana normal.</p>
  <p>Tu cuenta de Google debe estar activa en el navegador para que la app pueda leer tu hoja.</p>
</div>

<script>
(function() {
  var recibido = false;

  // Tu app (Index) envía este mensaje al padre cuando carga de verdad.
  // Si llega, es porque el iframe cargó la app, no la página 401 de Google.
  window.addEventListener('message', function(e) {
    if (e && e.data === 'bitacora-ready') recibido = true;
  });

  // Si en 10 segundos no llegó el mensaje, mostramos el aviso amigable.
  setTimeout(function() {
    if (!recibido) {
      document.getElementById('aviso').style.display = 'flex';
    }
  }, 10000);
})();
</script>
</body>
</html>
