<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora Financiera</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f172a; }
        #app { width: 100%; height: 100%; border: none; display: none; }
        #cortina {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100px;
            background: #0f172a;
            z-index: 999999;
            display: none;
        }
        #cargando {
            position: fixed; inset: 0;
            display: flex; justify-content: center; align-items: center;
            background: #0f172a; color: #94a3b8;
            font-family: Arial, sans-serif; font-size: 15px;
        }
    </style>
</head>
<body>
    <div id="cargando">Verificando acceso…</div>
    <iframe id="app" src="about:blank"></iframe>
    <div id="cortina"></div>
    <iframe id="detector" src="about:blank" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;"></iframe>

    <script>
    (function() {
        var APP_URL = 'https://script.google.com/macros/s/AKfycbyumXfpDlgpBlUPcDN1qCv3-oZ9iUrKWk2sFhSGW7AouLOl_vnkbTPX-EtXoKH4e1JzYg/exec';
        var app = document.getElementById('app');
        var detector = document.getElementById('detector');
        var cargando = document.getElementById('cargando');
        var cortina = document.getElementById('cortina');
        var decidido = false;

        function decidir(autorizado) {
            if (decidido) return;
            decidido = true;

            if (autorizado) {
                cargando.style.display = 'none';
                cortina.style.display = 'block';
                app.src = APP_URL;
                app.style.display = 'block';
            } else {
                window.location.replace(APP_URL);
            }
        }

        detector.onload = function() {
            // Si Google bloqueó el iframe (usuario no autorizado), contentWindow.length será 0.
            // Si cargó la app, será > 0.
            try {
                decidir(detector.contentWindow.length > 0);
            } catch (e) {
                decidir(false);
            }
        };

        detector.onerror = function() { decidir(false); };

        // Timeout: si en 4 segundos no hubo respuesta, redirigir a autorizar.
        setTimeout(function() { decidir(false); }, 4000);

        detector.src = APP_URL;
    })();
    </script>
</body>
</html>
