<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bitácora Financiera</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0f172a; }
#app { position:fixed; top:0; left:0; width:100%; height:100%; border:0; z-index:10; }
#cortina {
  position:fixed; top:0; left:0; width:100%; height:70px;
  background:#0f172a; z-index:2147483647; pointer-events:none;
}
@media (max-width: 600px) { #cortina { height: 90px; } }
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbzxEalV4dhRmowsOK2_YOay1P6Lc-a9H0Dm_d9kmaQfdWkn7Bn553rSZ3XaZw6LMJnvbQ/exec"></iframe>
<div id="cortina"></div>

<script>
(function() {
  var iframe = document.getElementById('app');
  var urlApp = iframe.src;
  var cargada = false;

  // Escuchamos si el Index de Apps Script avisa que cargó bien
  window.addEventListener('message', function(e) {
    if (e.data === 'bitacora-ready') {
      cargada = true;
    }
  });

  // Red de seguridad: si en 4 segundos el iframe no avisa, es que se bloqueó.
  // Abrimos la app directo en la ventana para que funcione perfecto.
  setTimeout(function() {
    if (!cargada) {
      window.location.href = urlApp;
    }
  }, 4000);
})();
</script>
</body>
</html>
