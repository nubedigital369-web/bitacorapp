<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi App</title>
  <style>
    :root {
      /* Altura del banner de Google que se recorta (ajústala si hace falta) */
      --crop: 50px;
    }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    /* Contenedor que "tapa" la franja superior del iframe */
    #wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    #app {
      position: absolute;
      top: calc(var(--crop) * -1);
      left: 0;
      width: 100%;
      height: calc(100% + var(--crop));
      border: 0;
    }
    /* Botón de respaldo si el navegador bloquea el iframe */
    #fallback {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 10;
      font: 13px/1 system-ui, sans-serif;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      opacity: .9;
    }
    #fallback:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="wrap">
    <iframe id="app" title="Mi App" allow="clipboard-write; fullscreen"></iframe>
  </div>

  <a id="fallback" target="_blank" rel="noopener">¿No carga? Abrir en pestaña nueva</a>

  <script>
    // 👉 Pega aquí la URL de tu implementación (termina en /exec)
    const APP_URL = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbxXnoAlyIGQn7k7Buik1cIidwr9i5g_CWnVCl6LqOa4jn3eHPvagw4kjkCb1OamRualNw/exec";

    document.getElementById("app").src = APP_URL;
    document.getElementById("fallback").href = APP_URL;
  </script>
</body>
</html>
