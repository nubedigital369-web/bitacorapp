<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora Financiera</title>
<style>
html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0f172a; }
#app { position:fixed; top:0; left:0; width:100%; height:100%; border:0; z-index:10; }
#cortina {
  position:fixed; top:0; left:0; width:100%; height:30px;
  background:#0f172a; z-index:2147483647; pointer-events:none;
}
@media (max-width: 600px) { #cortina { height: 50px; } }
</style>
</head>
<body>
<iframe id="app" src="about:blank"></iframe>
<div id="cortina"></div>

<script>
// Pega aquí la MISMA URL que ya tenías (la de /exec, no la de /library/)
const APP_URL = "https://script.google.com/macros/s/AKfycbzxEalV4dhRmowsOK2_YOay1P6Lc-a9H0Dm_d9kmaQfdWkn7Bn553rSZ3XaZw6LMJnvbQ/exec";

// Detectar iPhone/iPad
const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

if (esIOS) {
  // En iPhone, cargar directo en la misma ventana para evitar el 401
  window.location.replace(APP_URL);
} else {
  // En PC y Android, cargar en el iframe y tapar el banner con la cortina
  document.getElementById("app").src = APP_URL;
}
</script>
</body>
</html>
