<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bitácora Financiera</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f172a; font-family: 'Inter', Arial, sans-serif; }
        iframe { width: 100%; height: 100%; border: none; display: block; }

        #avisoAutorizacion {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0f172a;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        #avisoAutorizacion.visible { display: flex; }
        #avisoAutorizacion .caja {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        #avisoAutorizacion .icono {
            font-size: 48px;
            margin-bottom: 12px;
        }
        #avisoAutorizacion h2 {
            color: #f8fafc;
            margin: 0 0 12px 0;
            font-size: 20px;
            font-weight: 700;
        }
        #avisoAutorizacion p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }
        #btnAutorizar {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #0284c7;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        #btnAutorizar:hover { background: #0369a1; }
        #avisoAutorizacion .nota {
            color: #64748b;
            font-size: 12px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

<iframe id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxzXWTLcWrWXWfTZVyNjCYGu84zi_T4SrU_GACEZckd-cTM_fbeG5JgFVRzAgxg_ra9bg/exec"></iframe>

<div id="avisoAutorizacion">
    <div class="caja">
        <div class="icono">🔐</div>
        <h2>Autoriza la aplicación</h2>
        <p>La primera vez necesitas darle permiso a Google para que la aplicación funcione.</p>
        <button id="btnAutorizar" type="button">Autorizar ahora</button>
        <div class="nota">Después de autorizar, cierra esa pestaña y vuelve aquí.</div>
    </div>
</div>

<script>
(function() {
    var APP_URL = 'https://script.google.com/macros/s/AKfycbxzXWTLcWrWXWfTZVyNjCYGu84zi_T4SrU_GACEZckd-cTM_fbeG5JgFVRzAgxg_ra9bg/exec';
    var frame = document.getElementById('appFrame');
    var aviso = document.getElementById('avisoAutorizacion');
    var btn = document.getElementById('btnAutorizar');
    var yaCargo = false;

    function mostrarAviso() {
        if (yaCargo) return;
        aviso.classList.add('visible');
    }

    function ocultarAviso() {
        yaCargo = true;
        aviso.classList.remove('visible');
    }

    // Al cargar el iframe, comprobamos si realmente cargó contenido.
    frame.addEventListener('load', function() {
        try {
            if (frame.contentWindow && frame.contentWindow.length > 0) {
                ocultarAviso();
            } else {
                mostrarAviso();
            }
        } catch (e) {
            // Sin acceso al interior del iframe: asumimos que cargó.
            ocultarAviso();
        }
    });

    // Plan B: si después de 4 segundos no cargó, mostramos el aviso.
    setTimeout(function() {
        try {
            if (!yaCargo && (!frame.contentWindow || frame.contentWindow.length === 0)) {
                mostrarAviso();
            }
        } catch (e) {}
    }, 4000);

    // Botón de autorizar: abre la app en pestaña nueva.
    btn.addEventListener('click', function() {
        window.open(APP_URL, '_blank');
    });
})();
</script>

</body>
</html>
