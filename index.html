<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bitácora Financiera</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #0f172a;
}
iframe {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
  z-index: 10;
  display: none;
}
#cortina {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100px;
  background: #0f172a;
  z-index: 2147483647;
  display: none;
}
#cargando {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0f172a;
  color: #94a3b8;
  font-family: sans-serif;
  font-size: 15px;
  z-index: 20;
}
</style>
</head>
<body>
<div id="cargando">Cargando…</div>
<iframe id="app" src="about:blank"></iframe>
<div id="cortina"></div>
<script>
(function() {
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyumXfpDlgpBlUPcDN1qCv3-oZ9iUrKWk2sFhSGW7AouLOl_vnkbTPX-EtXoKH4e1JzYg/exec';
  var appFrame = document.getElementById('app');
  var cortina = document.getElementById('cortina');
  var cargando = document.getElementById('cargando');
  var decidido = false;

  function mostrarApp() {
    if (decidido) return;
    decidido = true;
    cargando.style.display = 'none';
    appFrame.src = APP_URL;
    appFrame.style.display = 'block';
    cortina.style.display = 'block';
  }

  function redirigir() {
    if (decidido) return;
    decidido = true;
    window.location.replace(APP_URL);
  }

  // Cargar la URL como <script> para detectar si el usuario está autorizado.
  var s = document.createElement('script');
  s.src = APP_URL + '?_t=' + Date.now();
  s.onload = mostrarApp;
  s.onerror = redirigir;
  document.body.appendChild(s);

  // Si en 5 segundos no hubo respuesta, redirigir.
  setTimeout(redirigir, 5000);
})();
</script>
</body>
</html>
