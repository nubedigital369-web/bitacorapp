<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Financiera</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0f172a;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1e293b;
            border-radius: 16px;
            border: 1px solid #334155;
            max-width: 420px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: #0284c7;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 8px;
            box-sizing: border-box;
            transition: background-color 0.2s ease;
        }
        .btn:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="font-size: 48px; margin-bottom: 16px;">🔐</div>
        <h1>Bitácora Financiera</h1>
        <p>Para acceder a tu información financiera, necesitas iniciar sesión con tu cuenta de Google. Se abrirá en una nueva pestaña.</p>
        <!--
          Este es el enlace clave.
          Reemplaza la URL de abajo por la URL REAL de tu implementación de Apps Script.
        -->
        <a class="btn" href="https://script.google.com/macros/s/AKfycbwBN0YwJONB6lpUg3i3yNwm6P05zUxZLoR4k3o5StDAvQVPXOtXLdCKuZ_xz_9EJarUpA/exec" target="_blank" rel="noopener">
            Iniciar sesión con Google
        </a>
    </div>
</body>
</html>
